<!DOCTYPE html>
<html>
<head>
<title>Remove Elements Dynamically</title>
</head>
<body>

<h1>Remove Elements Dynamically</h1>

<p id="demo">
This paragraph will be removed.
</p>

<button onclick="removeElement()">
Remove Paragraph
</button>

<script>

function removeElement(){

document
.getElementById("demo")
.remove();

}

</script>
