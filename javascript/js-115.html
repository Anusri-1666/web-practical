<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>

<style>

button{
width:70px;
height:70px;
font-size:25px;
}

</style>

</head>
<body align="center">

<h1>Tic Tac Toe</h1>

<div>

<button onclick="play(this)"></button>
<button onclick="play(this)"></button>
<button onclick="play(this)"></button>

<br>

<button onclick="play(this)"></button>
<button onclick="play(this)"></button>
<button onclick="play(this)"></button>

<br>

<button onclick="play(this)"></button>
<button onclick="play(this)"></button>
<button onclick="play(this)"></button>

</div>

<script>

let turn = "X";

function play(btn){

if(btn.innerHTML=="")
{
btn.innerHTML = turn;

turn =
(turn=="X") ? "O" : "X";
}

}

</script>

</body>
</html>
