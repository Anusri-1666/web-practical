<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>
</head>
<body align="center">

<h1>To Do List</h1>

<input
type="text"
id="task"
placeholder="Enter Task">

<button onclick="addTask()">
Add
</button>

<ul id="list"></ul>

<script>

function addTask(){

let task =
document.getElementById("task").value;

let li =
document.createElement("li");

li.innerHTML = task;

document.getElementById("list")
.appendChild(li);

document.getElementById("task").value="";

}

</script>

</body>
</html>
