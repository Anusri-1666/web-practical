<!DOCTYPE html>
<html>
<head>
<title>Temperature Converter</title>
</head>
<body>

<h1>Temperature Converter</h1>

<input type="number"
id="celsius"
placeholder="Celsius">

<button onclick="convertTemp()">
Convert
</button>

<h3 id="result"></h3>

<script>

function convertTemp(){

let celsius =
Number(document.getElementById("celsius").value);

let fahrenheit =
(celsius * 9/5) + 32;

document.getElementById("result").innerHTML =
"Fahrenheit = " + fahrenheit;

}

</script>

</body>
</html>
