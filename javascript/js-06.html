<!DOCTYPE html>
<html>
<head>
<title>Factorial of a Number</title>
<style>
body{
font-family:Arial;
padding:20px;
}
</style>
</head>
<body>

<h1>Factorial of a Number</h1>

<input type="number" id="num" placeholder="Enter Number">

<button onclick="findFactorial()">
Find Factorial
</button>

<h3 id="result"></h3>

<script>

function findFactorial(){

let n =
Number(document.getElementById("num").value);

let fact = 1;

for(let i=1;i<=n;i++)
{
fact = fact * i;
}

document.getElementById("result").innerHTML =
"Factorial = " + fact;

}

</script>

</body>
</html>
