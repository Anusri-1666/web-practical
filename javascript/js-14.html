<!DOCTYPE html>
<html>
<head>
<title>Sum and Average</title>
</head>
<body>

<h1>Sum and Average of Array Elements</h1>

<input type="text" id="array"
placeholder="10,20,30,40">

<button onclick="calculate()">
Calculate
</button>

<h3 id="result"></h3>

<script>

function calculate(){

let arr =
document.getElementById("array")
.value
.split(",")
.map(Number);

let sum = 0;

for(let i=0;i<arr.length;i++)
{
sum += arr[i];
}

let average =
sum / arr.length;

document.getElementById("result").innerHTML =
"Sum = " + sum +
"<br>Average = " + average;

}

</script>

</body>
</html>
