<!DOCTYPE html>
<html>
<head>
<title>Largest and Smallest Element</title>
</head>
<body>

<h1>Largest and Smallest Element in Array</h1>

<input type="text" id="array"
placeholder="10,20,30,40">

<button onclick="findValues()">
Find
</button>

<h3 id="result"></h3>

<script>

function findValues(){

let arr =
document.getElementById("array")
.value
.split(",")
.map(Number);

let largest =
Math.max(...arr);

let smallest =
Math.min(...arr);

document.getElementById("result").innerHTML =
"Largest = " + largest +
"<br>Smallest = " + smallest;

}

</script>

</body>
</html>
