<!DOCTYPE html>
<html>
<head>
<title>Prime Number Check</title>
</head>
<body>

<h1>Prime Number Check</h1>

<input type="number" id="num">

<button onclick="checkPrime()">
Check
</button>

<h3 id="result"></h3>

<script>

function checkPrime(){

let num =
Number(document.getElementById("num").value);

let prime = true;

if(num <= 1)
{
prime = false;
}

for(let i=2;i<num;i++)
{
if(num % i == 0)
{
prime = false;
break;
}
}

if(prime)
{
document.getElementById("result").innerHTML =
"Prime Number";
}
else
{
document.getElementById("result").innerHTML =
"Not a Prime Number";
}

}

</script>

</body>
</html>
