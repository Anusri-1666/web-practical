<!DOCTYPE html>
<html>
<head>
<title>Keyboard Events</title>
</head>
<body>

<h1>Keyboard Events</h1>

<input
type="text"
id="textbox"
onkeyup="showText()"
placeholder="Type Something">

<h3 id="result"></h3>

<script>

function showText(){

let text =
document.getElementById("textbox").value;

document.getElementById("result").innerHTML =
"You Typed: " + text;

}

</script>

</body>
</html>
