<!DOCTYPE html>
<html>
<head>
<title>Positive Negative Zero</title>
</head>
<body>

<h1>Positive, Negative or Zero</h1>

<input type="number" id="num">

<button onclick="checkValue()">
Check
</button>

<h3 id="result"></h3>

<script>

function checkValue(){

let num =
Number(document.getElementById("num").value);

if(num > 0)
{
document.getElementById("result").innerHTML =
"Positive Number";
}
else if(num < 0)
{
document.getElementById("result").innerHTML =
"Negative Number";
}
else
{
document.getElementById("result").innerHTML =
"Zero";
}

}

</script>

</body>
</html>
