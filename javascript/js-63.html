<!DOCTYPE html>
<html>
<head>
<title>Count Vowels and Consonants</title>
</head>
<body>

<h1>Count Vowels and Consonants</h1>

<input type="text" id="text"
placeholder="Enter Text">

<button onclick="countLetters()">
Count
</button>

<h3 id="result"></h3>

<script>

function countLetters(){

let text =
document.getElementById("text")
.value
.toLowerCase();

let vowels = 0;
let consonants = 0;

for(let char of text)
{
if("aeiou".includes(char))
{
vowels++;
}
else if(char >= 'a' && char <= 'z')
{
consonants++;
}
}

document.getElementById("result").innerHTML =
"Vowels = " + vowels +
"<br>Consonants = " + consonants;

}

</script>

</body>
</html>
