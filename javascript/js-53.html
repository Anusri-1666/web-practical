<!DOCTYPE html>
<html>
<head>
<title>Grade Calculator</title>
</head>
<body>

<h1>Student Grade Calculator</h1>

<input type="number" id="marks"
placeholder="Enter Marks">

<button onclick="findGrade()">
Find Grade
</button>

<h3 id="result"></h3>

<script>

function findGrade(){

let marks =
Number(document.getElementById("marks").value);

let grade;

if(marks >= 90)
grade = "A";

else if(marks >= 75)
grade = "B";

else if(marks >= 60)
grade = "C";

else
grade = "D";

document.getElementById("result").innerHTML =
"Grade = " + grade;

}

</script>

</body>
</html>
