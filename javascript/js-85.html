<!DOCTYPE html>
<html>
<head>
<title>Form Events</title>
</head>
<body>

<h1>Form Event Example</h1>

<form onsubmit="return submitForm()">

<input
type="text"
id="name"
placeholder="Enter Name">

<input
type="submit"
value="Submit">

</form>

<h3 id="result"></h3>

<script>

function submitForm(){

let name =
document.getElementById("name").value;

document.getElementById("result").innerHTML =
"Welcome " + name;

return false;

}

</script>

<hr>

<a href="index.html">JavaScript Programs</a>

</body>
</html>
