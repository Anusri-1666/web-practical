<!DOCTYPE html>
<html>
<head>
<title>Event Capturing</title>

<style>

#parent{
padding:40px;
background:lightblue;
}

#child{
padding:30px;
background:orange;
}

</style>

</head>
<body>

<h1>Event Capturing</h1>

<div id="parent">

Parent Div

<div id="child">
Child Div
</div>

</div>

<script>

document.getElementById("parent")
.addEventListener("click", function(){

alert("Parent Clicked");

}, true);

document.getElementById("child")
.addEventListener("click", function(){

alert("Child Clicked");

}, true);

</script>

<a href="index.html">JavaScript Programs</a>

</body>
</html>
