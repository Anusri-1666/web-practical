<!DOCTYPE html>
<html>
<head>
<title>Image Hover Effect</title>

<style>

body{
font-family:Arial;
text-align:center;
}

img{
width:300px;
height:200px;
transition:0.5s;
border-radius:10px;
}

img:hover{
transform:scale(1.1);
opacity:0.8;
box-shadow:0 0 20px gray;
}

</style>
</head>

<body>

<h1>Image Hover Effect</h1>

<img src="https://picsum.photos/300/200" alt="Sample Image">

<p>Move the mouse over the image.</p>

</body>
</html>
