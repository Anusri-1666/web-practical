<!DOCTYPE html>
<html>
<head>
<title>CSS Display Properties</title>

<style>

body{
font-family: Arial, sans-serif;
text-align:center;
}

/* Block */
.block{
display:block;
background-color:lightblue;
border:2px solid black;
padding:10px;
margin:10px;
}

/* Inline */
.inline{
display:inline;
background-color:lightgreen;
border:2px solid black;
padding:10px;
}

/* Inline-Block */
.inlineblock{
display:inline-block;
width:150px;
height:80px;
background-color:lightcoral;
border:2px solid black;
margin:10px;
padding:10px;
}

/* None */
.none{
display:none;
background-color:yellow;
border:2px solid black;
padding:10px;
}

</style>
</head>

<body>

<h1>CSS Display Properties</h1>

<h3>display: block</h3>
<div class="block">Block Element 1</div>
<div class="block">Block Element 2</div>

<h3>display: inline</h3>
<span class="inline">Inline 1</span>
<span class="inline">Inline 2</span>

<h3>display: inline-block</h3>
<div class="inlineblock">Inline-Block 1</div>
<div class="inlineblock">Inline-Block 2</div>

<h3>display: none</h3>
<p>The element below is hidden using <b>display:none</b>.</p>

<div class="none">
You cannot see this content.
</div>

</body>
</html>
