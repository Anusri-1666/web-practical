<!DOCTYPE html>
<html>
<head>
<title>News Blog Layout</title>
<style>
body{
font-family:Arial;

}

.container{

grid-template-columns:2fr 1fr;

padding:20px;
}

.main{
background:#f0f0f0;
padding:20px;
}

.sidebar{
background:#d9edf7;
padding:20px;
}

header{
background:#333;
color:white;
padding:20px;
text-align:center;
}
</style>
</head>

<header>
<h1>Daily News Blog</h1>
</header>

<div class="container">

<div class="main">
<h2>Main News Article</h2>
<p>Latest updates and breaking news content.</p>
</div>

<div class="sidebar">
<h3>Recent Posts</h3>
<p>Technology</p>
<p>Education</p>
<p>Sports</p>
</div>

</div>
