<!DOCTYPE html>
<html>
<head>

<title>Float and Clear</title>

<style>

.left{
    float:left;
    width:200px;
    background:lightblue;
}

.right{
    float:right;
    width:200px;
    background:lightgreen;
}

.clear{
    clear:both;
}

</style>

</head>
<body>

<h1>Float and Clear</h1>

<div class="left">
Left Float
</div>

<div class="right">
Right Float
</div>

<div class="clear">
Both floats cleared here.
</div>

</body>
</html>
