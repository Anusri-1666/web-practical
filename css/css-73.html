<!DOCTYPE html>
<html>
<head>
<title>Clamp Min Max Functions</title>

<style>

body{
font-family:Arial;
text-align:center;
padding:20px;
}

h1{
font-size:clamp(24px, 5vw, 60px);
color:blue;
}

.box1{
width:min(500px, 90%);
background:lightblue;
padding:20px;
margin:20px auto;
}

.box2{
width:max(300px, 50%);
background:lightgreen;
padding:20px;
margin:20px auto;
}

</style>
</head>

<body>

<h1>CSS clamp(), min() and max()</h1>

<div class="box1">
Using min() Function
</div>

<div class="box2">
Using max() Function
</div>

</body>
</html>
