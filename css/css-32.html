<!DOCTYPE html>
<html>
<head>
<title>Box Shadow and Text Shadow</title>

<style>

body{
font-family: Arial, sans-serif;
text-align: center;
}

/* Text Shadow */
h1{
color: blue;
text-shadow: 3px 3px 5px gray;
}

/* Box Shadow */
.box{
width: 300px;
height: 150px;
background-color: lightblue;
margin: 50px auto;
padding: 20px;
border: 2px solid black;
box-shadow: 10px 10px 15px gray;
}

</style>

</head>
<body>

<h1>Text Shadow Example</h1>

<div class="box">
<h2>Box Shadow Example</h2>
<p>This box uses the CSS box-shadow property.</p>
</div>

</body>
</html>
