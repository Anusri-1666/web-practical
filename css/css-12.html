<!DOCTYPE html>
<html>
<head>

<title>Lists and Tables</title>

<style>

ul{
    list-style-type:square;
    color:blue;
}

table{
    border-collapse:collapse;
    width:60%;
}

th{
    background:darkblue;
    color:white;
}

th,td{
    border:1px solid black;
    padding:10px;
    text-align:center;
}

</style>

</head>
<body>

<h1>CSS Lists and Tables</h1>

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
</tr>

<tr>
    <td>1</td>
    <td>Anusri</td>
</tr>

<tr>
    <td>2</td>
    <td>Rahul</td>
</tr>

</table>

<br>

<a href="../index.html">Home</a>
<a href="index.html">Back</a>

</body>
</html>
