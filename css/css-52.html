<!DOCTYPE html>
<html>
<head>
<title>Responsive Footer</title>

<style>

body{
margin:0;
font-family:Arial;
}

.content{
min-height:80vh;
padding:20px;
}

.footer{
background:#222;
color:white;
display:flex;
justify-content:space-around;
flex-wrap:wrap;
padding:20px;
}

.footer div{
margin:10px;
}

</style>
</head>

<body>

<div class="content">
<h1>Responsive Footer Example</h1>
</div>

<footer class="footer">
<div>About Us</div>
<div>Services</div>
<div>Contact</div>
<div>Follow Us</div>
</footer>

</body>
</html>
