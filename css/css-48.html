<!DOCTYPE html>
<html>
<head>
<title>Two Column Layout</title>

<style>

body{
font-family:Arial;
margin:0;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
height:100vh;
}

.left{
background:lightgreen;
padding:20px;
}

.right{
background:lightblue;
padding:20px;
}

</style>

</head>
<body>

<div class="container">

<div class="left">
Sidebar
</div>

<div class="right">
Main Content
</div>

</div>

</body>
</html>
