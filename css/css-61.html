<!DOCTYPE html>
<html>
<head>
<title>CSS Grid Template Areas</title>

<style>
body{
font-family:Arial;
margin:0;
}

.container{
display:grid;
grid-template-areas:
"header header"
"sidebar content"
"footer footer";
grid-template-columns:1fr 3fr;
gap:10px;
padding:10px;
}

.header{
grid-area:header;
background:lightblue;
padding:20px;
}

.sidebar{
grid-area:sidebar;
background:lightgreen;
padding:20px;
}

.content{
grid-area:content;
background:lightyellow;
padding:20px;
}

.footer{
grid-area:footer;
background:lightcoral;
padding:20px;
}
</style>
</head>

<body>

<div class="container">
<div class="header">Header</div>
<div class="sidebar">Sidebar</div>
<div class="content">Main Content</div>
<div class="footer">Footer</div>
</div>

</body>
</html>
