<!DOCTYPE html>
<html>
<head>
<title>2D and 3D Transformations</title>

<style>

body{
text-align:center;
font-family:Arial;
}

.box{
width:200px;
height:200px;
background:orange;
margin:50px auto;
transition:1s;
}

.box:hover{
transform:rotate(45deg) scale(1.2);
}

/* 3D Box */
.box3d{
width:200px;
height:200px;
background:lightblue;
margin:50px auto;
transition:1s;
}

.box3d:hover{
transform:rotateY(180deg);
}

</style>
</head>

<body>

<h1>2D Transformation</h1>
<div class="box"></div>

<h1>3D Transformation</h1>
<div class="box3d"></div>

<a href="../index.html">Home</a>
<a href="index.html">Back</a>

</body>
</html>
