<!DOCTYPE html>
<html>
<head>

<title>Styled Registration Form</title>

<style>

body{
    font-family:Arial;
}

form{
    width:350px;
    margin:auto;
    padding:20px;
    border:1px solid gray;
    border-radius:10px;
    background:#f5f5f5;
}

input,select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
}

</style>

</head>
<body>

<h1 align="center">
Student Registration Form
</h1>

<form>

Name:
<input type="text">

Email:
<input type="email">

Course:
<select>
    <option>BCA</option>
    <option>BSc</option>
    <option>BTech</option>
</select>

<button>
Register
</button>

</form>

<br>

<a href="../index.html">Home</a>
<a href="index.html">Back</a>

</body>
</html>
