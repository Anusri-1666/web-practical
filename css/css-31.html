<!DOCTYPE html>
<html>
<head>
<title>Linear and Radial Gradients</title>

<style>

body{
font-family: Arial, sans-serif;
text-align: center;
}

/* Linear Gradient */
.linear{
width: 400px;
height: 200px;
margin: 20px auto;
border: 2px solid black;
background: linear-gradient(to right, red, yellow, green);
color: white;
font-size: 24px;
line-height: 200px;
font-weight: bold;
}

/* Radial Gradient */
.radial{
width: 400px;
height: 200px;
margin: 20px auto;
border: 2px solid black;
background: radial-gradient(circle, blue, lightblue, white);
font-size: 24px;
line-height: 200px;
font-weight: bold;
}

</style>

</head>
<body>

<h1>Linear and Radial Gradients using CSS</h1>

<div class="linear">
Linear Gradient
</div>

<div class="radial">
Radial Gradient
</div>

<a href="index.html">Back</a>

</body>
</html>
