<!DOCTYPE html>
<html>
<head>

<title>Navigation Bar</title>

<style>

ul{
    list-style:none;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#333;
}

li{
    float:left;
}

li a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px;
}

li a:hover{
    background:black;
}

</style>

</head>
<body>

<h1>Navigation Bar</h1>

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">About</a></li>

<li><a href="#">Services</a></li>

<li><a href="#">Contact</a></li>

</ul>

<br><br>

<a href="../index.html">Home</a>
<a href="index.html">Back</a>

</body>
</html>
