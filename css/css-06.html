<!DOCTYPE html>
<html>
<head>
<title>Width Height and Sizing Properties</title>

<style>

.box1{
width:200px;
height:100px;
background-color:lightblue;
border:2px solid black;
margin:10px;
}

.box2{
width:50%;
height:120px;
background-color:lightgreen;
border:2px solid black;
margin:10px;
}

.box3{
max-width:400px;
min-height:80px;
background-color:lightcoral;
border:2px solid black;
margin:10px;
padding:10px;
}

.box4{
width:300px;
height:auto;
background-color:lightyellow;
border:2px solid black;
margin:10px;
padding:10px;
}

</style>

</head>

<body>

<h1>Width, Height and Sizing Properties</h1>

<div class="box1">
Fixed Width = 200px<br>
Fixed Height = 100px
</div>

<div class="box2">
Width = 50% of Screen<br>
Height = 120px
</div>

<div class="box3">
Using max-width and min-height properties
</div>

<div class="box4">
This box demonstrates auto sizing with content. The height adjusts automatically according to the content inside the box.
</div>

</body>
</html>
