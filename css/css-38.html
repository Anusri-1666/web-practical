<!DOCTYPE html>
<html>
<head>
<title>Visibility and Hiding Elements</title>

<style>

body{
font-family:Arial, sans-serif;
text-align:center;
}

.visible{
background:lightgreen;
padding:15px;
margin:10px;
}

.hidden{
visibility:hidden;
background:lightcoral;
padding:15px;
margin:10px;
}

.none{
display:none;
background:lightblue;
padding:15px;
margin:10px;
}

</style>
</head>

<body>

<h1>Visibility and Hiding Elements</h1>

<div class="visible">
This element is visible.
</div>

<div class="hidden">
This element is hidden using visibility:hidden.
</div>

<div class="none">
This element is hidden using display:none.
</div>

<p>
The hidden element occupies space, while display:none removes it completely.
</p>

</body>
</html>
