<!DOCTYPE html>
<html>
<head>
<title>CSS Filters</title>

<style>

body{
font-family:Arial;
text-align:center;
}

img{
width:250px;
margin:15px;
}

.blur{
filter:blur(3px);
}

.grayscale{
filter:grayscale(100%);
}

.brightness{
filter:brightness(150%);
}

.contrast{
filter:contrast(200%);
}

</style>

</head>
<body>

<h1>CSS Filters</h1>

<h3>Blur</h3>
<img class="blur" src="https://picsum.photos/250/200">

<h3>Grayscale</h3>
<img class="grayscale" src="https://picsum.photos/251/200">

<h3>Brightness</h3>
<img class="brightness" src="https://picsum.photos/252/200">

<h3>Contrast</h3>
<img class="contrast" src="https://picsum.photos/253/200">

</body>
</html>
