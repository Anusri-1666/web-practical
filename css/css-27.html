<!DOCTYPE html>
<html>
<head>
<title>CSS Selectors Demonstration</title>

<style>

/* Universal Selector */
*{
font-family: Arial;
}

/* Element Selector */
h2{
color: blue;
}

/* Class Selector */
.highlight{
background-color: yellow;
}

/* ID Selector */
#special{
color: red;
font-weight: bold;
}

/* Attribute Selector */
input[type="text"]{
border: 2px solid green;
padding: 5px;
}

/* Grouping Selector */
h3, p{
color: purple;
}

</style>

</head>
<body>

<h1>CSS Selectors Demonstration</h1>

<h2>Element Selector Example</h2>

<p>This paragraph uses the grouping selector.</p>

<h3>This heading also uses the grouping selector.</h3>

<p class="highlight">
This paragraph uses the class selector.
</p>

<p id="special">
This paragraph uses the ID selector.
</p>

<input type="text" placeholder="Text Input">

<br><br>

<input type="password" placeholder="Password Input">

</body>
</html>
