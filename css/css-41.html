<!DOCTYPE html>
<html>
<head>
<title>CSS Tooltip</title>

<style>
body{
font-family:Arial;
text-align:center;
margin-top:100px;
}

.tooltip{
position:relative;
display:inline-block;
cursor:pointer;
}

.tooltiptext{
visibility:hidden;
background:black;
color:white;
padding:8px;
border-radius:5px;
position:absolute;
bottom:125%;
left:50%;
transform:translateX(-50%);
}

.tooltip:hover .tooltiptext{
visibility:visible;
}
</style>

</head>
<body>

<h1>CSS Tooltip Example</h1>

<div class="tooltip">
Hover Over Me
<span class="tooltiptext">
This is a Tooltip
</span>
</div>

<a href="../index.html">Home</a>
<a href="index.html">Back</a>

</body>
</html>
