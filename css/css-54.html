<!DOCTYPE html>
<html>
<head>
<title>Responsive Contact Form</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

form{
max-width:500px;
margin:40px auto;
background:white;
padding:20px;
box-shadow:0 0 10px gray;
}

input, textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
background:green;
color:white;
border:none;
}

</style>
</head>

<body>

<form>

<h2>Contact Us</h2>

<input type="text" placeholder="Name">

<input type="email" placeholder="Email">

<textarea rows="5" placeholder="Message"></textarea>

<button>Send</button>

</form>

</body>
</html>
