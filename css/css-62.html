<!DOCTYPE html>
<html>
<head>
<title>Flexbox Alignment and Ordering</title>

<style>
.container{
display:flex;
justify-content:space-around;
align-items:center;
height:200px;
border:2px solid black;
}

.box{
width:100px;
height:100px;
background:skyblue;
text-align:center;
line-height:100px;
font-size:20px;
}

.box1{order:3;}
.box2{order:1;}
.box3{order:2;}
</style>
</head>

<body>

<h1>Flexbox Alignment and Ordering</h1>

<div class="container">
<div class="box box1">1</div>
<div class="box box2">2</div>
<div class="box box3">3</div>
</div>

</body>
</html>
