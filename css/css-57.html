<!DOCTYPE html>
<html>
<head>
<title>Online Shopping Page</title>
<style>
body{
font-family:Arial;
margin:0;
}
header{
background:#0077cc;
color:white;
padding:20px;
text-align:center;
}
.products{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:20px;
}
.card{
width:220px;
border:1px solid #ccc;
padding:15px;
text-align:center;
box-shadow:0 0 10px gray;
}
button{
background:green;
color:white;
border:none;
padding:10px;
}
</style>
</head>
<body>

<header>
<h1>Online Shopping Store</h1>
</header>

<div class="products">

<div class="card">
<h3>Mobile Phone</h3>
<p>₹15,000</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Laptop</h3>
<p>₹45,000</p>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>Headphones</h3>
<p>₹2,000</p>
<button>Add to Cart</button>
</div>

</div>

</body>
</html>
