<!DOCTYPE html>
<html>
<head>
<title>Responsive Typography</title>

<style>

body{
font-family:Arial, sans-serif;
text-align:center;
padding:20px;
}

h1{
font-size:5vw;
color:blue;
}

p{
font-size:2vw;
}

@media(max-width:768px){
h1{
font-size:8vw;
}

p{
font-size:4vw;
}
}

</style>
</head>

<body>

<h1>Responsive Typography</h1>

<p>
Resize the browser window to see the text size change automatically.
</p>

</body>
</html>
