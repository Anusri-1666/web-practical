<!DOCTYPE html>
<html>
<head>
<title>Keyframe Animation</title>

<style>

body{
font-family:Arial;
text-align:center;
}

.box{
width:100px;
height:100px;
background:red;
position:relative;
animation:moveBox 4s infinite;
}

@keyframes moveBox{
0%{left:0;}
50%{left:300px; background:blue;}
100%{left:0; background:red;}
}

</style>

</head>
<body>

<h1>Keyframe Animation</h1>

<div class="box"></div>

</body>
</html>
