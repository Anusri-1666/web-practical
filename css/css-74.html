<!DOCTYPE html>
<html>
<head>
<title>CSS Calc Function</title>

<style>

body{
font-family:Arial;
margin:0;
}

.header{
background:blue;
color:white;
padding:20px;
text-align:center;
height:80px;
}

.content{
height:calc(100vh - 80px);
background:lightgray;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
}

</style>
</head>

<body>

<div class="header">
<h1>CSS calc() Function</h1>
</div>

<div class="content">
Remaining Height Calculated using calc()
</div>

</body>
</html>
