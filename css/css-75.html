<!DOCTYPE html>
<html>
<head>
<title>Responsive Website</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

nav{
display:flex;
justify-content:center;
gap:20px;
background:#0055aa;
padding:15px;
}

nav a{
color:white;
text-decoration:none;
}

.hero{
display:flex;
justify-content:center;
align-items:center;
height:300px;
background:#e6f2ff;
font-size:30px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:20px;
}

.card{
background:white;
padding:20px;
border:1px solid #ccc;
box-shadow:0 0 5px gray;
text-align:center;
}

footer{
background:#003366;
color:white;
text-align:center;
padding:15px;
}

@media(max-width:768px){

nav{
flex-direction:column;
text-align:center;
}

.grid{
grid-template-columns:1fr;
}

.hero{
font-size:22px;
height:200px;
}

}

</style>
</head>

<body>

<header>
<h1>My Responsive Website</h1>
</header>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>

<div class="hero">
Welcome to My Website
</div>

<div class="grid">

<div class="card">
<h3>HTML5</h3>
<p>Modern webpage structure.</p>
</div>

<div class="card">
<h3>CSS3</h3>
<p>Responsive and attractive design.</p>
</div>

<div class="card">
<h3>Flexbox & Grid</h3>
<p>Powerful layout systems.</p>
</div>

</div>

<footer>
© 2026 Responsive Website Demo
</footer>

</body>
</html>
