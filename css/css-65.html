<!DOCTYPE html>
<html>
<head>
<title>CSS Transitions</title>

<style>

body{
text-align:center;
font-family:Arial;
}

.box{
width:200px;
height:200px;
background:red;
margin:50px auto;
transition:all 0.5s;
}

.box:hover{
background:blue;
transform:scale(1.2);
}

</style>
</head>

<body>

<h1>CSS Transition Example</h1>

<div class="box"></div>

</body>
</html>
