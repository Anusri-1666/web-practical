<!DOCTYPE html>
<html>
<head>
<title>Login and Signup</title>

<style>

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f4f4;
}

.container{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.form-box{
background:white;
padding:20px;
width:250px;
box-shadow:0 0 10px gray;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
width:100%;
padding:10px;
background:blue;
color:white;
border:none;
}

</style>
</head>

<body>

<div class="container">

<div class="form-box">
<h2>Login</h2>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
</div>

<div class="form-box">
<h2>Signup</h2>
<input type="text" placeholder="Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button>Signup</button>
</div>

</div>

<a href="../index.html">Home</a>
<a href="index.html">Back</a>

</body>
</html>
