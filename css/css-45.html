<!DOCTYPE html>
<html>
<head>
<title>Responsive Image Gallery</title>

<style>

body{
font-family:Arial;
text-align:center;
}

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

.gallery img{
width:300px;
height:200px;
border-radius:10px;
}

@media(max-width:768px){
.gallery img{
width:90%;
height:auto;
}
}

</style>

</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="gallery">

</div>
