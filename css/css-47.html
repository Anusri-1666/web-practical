<!DOCTYPE html>
<html>
<head>
<title>Dashboard Layout</title>

<style>

body{
font-family:Arial;
margin:0;
}

.grid{
display:grid;
grid-template-columns:1fr 3fr;
grid-template-rows:80px 400px;
gap:10px;
}

.header{
background:blue;
color:white;
padding:20px;
}

.sidebar{
background:lightgray;
padding:20px;
}

.content{
background:lightblue;
padding:20px;
}

</style>

</head>
<body>

<div class="grid">

<div class="header">
Dashboard Header
</div>

<div class="sidebar">
Sidebar Menu
</div>

<div class="content">
Main Content Area
</div>

</div>

</body>
</html>
