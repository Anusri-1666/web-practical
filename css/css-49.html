<!DOCTYPE html>
<html>
<head>
<title>Three Column Layout</title>

<style>

body{
font-family:Arial;
margin:0;
}

.container{
display:flex;
height:100vh;
}

.column{
flex:1;
padding:20px;
}

.col1{
background:lightcoral;
}

.col2{
background:lightgreen;
}

.col3{
background:lightblue;
}

</style>

</head>
<body>

<div class="container">

<div class="column col1">
Column 1
</div>

<div class="column col2">
Column 2
</div>

<div class="column col3">
Column 3
</div>

</div>

</body>
</html>
