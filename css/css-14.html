<!DOCTYPE html>
<html>
<head>

<title>CSS Flexbox</title>

<style>

.container{

    display:flex;

    justify-content:space-around;

    align-items:center;

    height:200px;

    border:2px solid black;
}

.box{

    width:100px;

    height:100px;

    background:lightblue;

    text-align:center;

    line-height:100px;

    font-weight:bold;
}

</style>

</head>
<body>

<h1>Flexbox Layout</h1>

<div class="container">

<div class="box">1</div>

<div class="box">2</div>

<div class="box">3</div>

</div>

</body>
</html>
