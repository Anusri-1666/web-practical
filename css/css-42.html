<!DOCTYPE html>
<html>
<head>
<title>Button Hover Animation</title>

<style>

body{
text-align:center;
font-family:Arial;
margin-top:100px;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
background:blue;
color:white;
cursor:pointer;
transition:0.4s;
}

button:hover{
background:red;
transform:scale(1.1);
}

</style>

</head>
<body>

<h1>Button Hover Animation</h1>

<button>
Hover Me
</button>

<a href="index.html">Back</a>

</body>
</html>
