<!DOCTYPE html>
<html>
<head>
<title>Border Radius Shapes</title>

<style>

body{
font-family: Arial, sans-serif;
text-align: center;
}

/* Square */
.square{
width:150px;
height:150px;
background-color:lightblue;
margin:20px auto;
border:2px solid black;
}

/* Rounded Rectangle */
.rounded{
width:200px;
height:100px;
background-color:lightgreen;
margin:20px auto;
border:2px solid black;
border-radius:20px;
}

/* Circle */
.circle{
width:150px;
height:150px;
background-color:lightcoral;
margin:20px auto;
border:2px solid black;
border-radius:50%;
}

/* Oval */
.oval{
width:220px;
height:120px;
background-color:khaki;
margin:20px auto;
border:2px solid black;
border-radius:50%;
}

</style>

</head>
<body>

<h1>Border Radius Shapes using CSS</h1>

<h3>Square</h3>
<div class="square"></div>

<h3>Rounded Rectangle</h3>
<div class="rounded"></div>

<h3>Circle</h3>
<div class="circle"></div>

<h3>Oval</h3>
<div class="oval"></div>

<a href="index.html">Back</a>

</body>
</html>
