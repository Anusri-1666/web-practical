<!DOCTYPE html>
<html>
<head>

<title>Combinator Selectors</title>

<style>

div p{
    color:blue;
}

div > h2{
    color:red;
}

h3 + p{
    background:lightgreen;
}

</style>

</head>
<body>

<h1>Combinator Selectors</h1>

<div>

<h2>Child Selector Example</h2>

<p>Descendant Selector Example</p>

</div>

<h3>Adjacent Sibling Selector</h3>

<p>
This paragraph is selected by h3 + p.
</p>

</body>
</html>
